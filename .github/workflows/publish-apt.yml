name: Publish signed APT repository and demo

on:
  push:
    branches: [main]
    paths:
      - 'apt/**'
      - 'docs/demo/**'
      - '.github/workflows/publish-apt.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify the signed package archive before publication
        run: |
          gpgv --keyring "$PWD/apt/67-archive-keyring.gpg" apt/InRelease
          gzip -t apt/Packages.gz
          for package in apt/pool/67_*_all.deb; do
            dpkg-deb --info "$package"
          done
      - name: Assemble the APT repository and demo site
        run: |
          mkdir -p dist/pages/demo
          cp -a apt/. dist/pages/
          cp -a docs/demo/. dist/pages/demo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
