name: Publish signed APT repository

on:
  push:
    branches: [main]
    paths:
      - 'apt/**'
      - '.github/workflows/publish-apt.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install runtime dependencies for the isolated installation simulation
        run: |
          sudo apt-get update
          sudo apt-get install -y chafa zsh
      - name: Verify the signed repository before publication
        run: |
          gpgv --keyring "$PWD/apt/67-archive-keyring.gpg" apt/InRelease
          ./tests/apt-repository.sh
        env:
          REPOSITORY: ${{ github.workspace }}/apt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apt
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
